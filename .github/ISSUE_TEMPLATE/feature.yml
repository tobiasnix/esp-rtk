name: Feature request
description: Suggest an improvement or a new capability for ESP-RTK.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the firmware or the portal does not currently support well?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to see instead? Sketch the behaviour, not necessarily the implementation.
    validations:
      required: true
