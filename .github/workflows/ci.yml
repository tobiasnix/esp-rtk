name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install host-tool dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Committed build matches src/
        run: python3 push.py . --build-only --check
      - name: Unit tests, language gate, and repository checks
        shell: bash
        run: |
          set +e
          python3 -m unittest discover -s tests > unittest.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::Relevant unittest tracebacks"
            grep -n -E -A 28 -B 3 '^(ERROR|FAIL):' unittest.log || true
            echo "::endgroup::"
            echo "::group::Unittest summary and final output"
            tail -n 100 unittest.log
            echo "::endgroup::"
            exit "$status"
          fi
          grep -E '^Ran |^OK$' unittest.log
      - name: Compile Python
        run: python3 -m compileall -q .
      - name: Check JavaScript syntax
        run: |
          for file in *.js src/*.js tests/*.js; do
            node --check "$file"
          done
      - name: Check repository hygiene
        run: |
          test -f LICENSE
          test ! -e config.json
          test ! -e backup
          test ! -e docs/internal || test -f tools/export_public.py
          git diff --check
      - name: Scan committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  browser:
    # The suites take about an hour in one job; four balanced shards run in parallel.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install host-tool dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Browser acceptance (Playwright mock harness, shard ${{ matrix.shard }})
        run: python3 tests/browser_acceptance.py --install --with-deps --shard ${{ matrix.shard }}
